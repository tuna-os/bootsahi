name: Build asahi-installer payload

# D0 of docs/DESIGN.md: package the bootsahi bootstrap as an asahi-installer
# payload (esp/ + root.img zip + installer_data.json). With upload_r2 on main,
# a tested payload is published as an immutable release under
# download.tunaos.org/asahi/releases/<version>/, and then the
# asahi/installer_data.json pointer moves to it (#99, #132).
#
# The image is run `--privileged --pid=host` with the host's /dev, in a job
# that can hold R2 credentials, so it must be exactly a bootstrap that a main
# build of build-bootstrap-image.yml signed (#97, #122): a digest-pinned
# ghcr.io/tuna-os/bootsahi-bootstrap reference, verified with cosign against
# that workflow's refs/heads/main identity before anything pulls or runs it.
# No tag is accepted, so the bytes packaged are the bytes that were verified.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Signed bootstrap, pinned by digest: ghcr.io/tuna-os/bootsahi-bootstrap@sha256:… (printed in the summary of a main build-bootstrap-image run)"
        required: true
        type: string
      name:
        description: "Payload name"
        default: "tunaos-bootstrap"
        type: string
      bootstrap_size_gb:
        description: "Bootstrap partition size (GB) — the loopback disk root.img is built in, NOT the installed system's disk"
        default: "24"
        type: string
      target_min_gb:
        description: "Minimum size (GB) of the expanding target partition the installed OS goes into"
        default: "12"
        type: string
      upload_r2:
        description: "Upload payload zip and installer_data.json to Cloudflare R2 (download.tunaos.org/asahi)"
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  BOOTSTRAP_IDENTITY: https://github.com/tuna-os/bootsahi/.github/workflows/build-bootstrap-image.yml@refs/heads/main
  BOOTSTRAP_ISSUER: https://token.actions.githubusercontent.com
  PUBLIC_BASE: https://download.tunaos.org/asahi

jobs:
  payload:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    # One payload run at a time, so two publishes can never interleave their
    # release uploads or pointer moves (#132). Queued runs wait; none is cancelled.
    concurrency:
      group: asahi-payload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign (the version the bootstrap ships)
        run: |
          ./scripts/install-cosign.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify the bootstrap signature
        # Dispatch inputs travel via env, never interpolated into the script
        # body: a value containing shell metacharacters would be parsed as
        # commands after expression substitution (bootc-installer-asahi#75).
        id: verify
        env:
          PAYLOAD_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if ! [[ "$PAYLOAD_IMAGE" =~ ^ghcr\.io/tuna-os/bootsahi-bootstrap@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image must be ghcr.io/tuna-os/bootsahi-bootstrap@sha256:<digest>; tags and other repositories are refused"
            exit 1
          fi
          pinned=$(./scripts/verify-image.sh "$PAYLOAD_IMAGE" "$BOOTSTRAP_IDENTITY" "$BOOTSTRAP_ISSUER")
          if [ "$pinned" != "$PAYLOAD_IMAGE" ]; then
            echo "::error::verified $pinned, which is not the requested $PAYLOAD_IMAGE"
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Pull image
        env:
          PAYLOAD_IMAGE: ${{ steps.verify.outputs.pinned }}
        run: sudo podman pull "$PAYLOAD_IMAGE"

      - name: Free up disk space
        # Desktop images need a 16G loopback disk + pulled layers + the
        # zipped payload; stock runners don't have the headroom.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Choose the release version
        # Unique per run and attempt, so a release prefix is written once and
        # never reused (#132).
        id: version
        run: echo "version=$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build payload
        env:
          TARGET_MIN_GB: ${{ inputs.target_min_gb }}
          PAYLOAD_IMAGE: ${{ steps.verify.outputs.pinned }}
          PAYLOAD_NAME: ${{ inputs.name }}
          PAYLOAD_SIZE_GB: ${{ inputs.bootstrap_size_gb }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # installer_data.json names this release's own immutable zip URL; the
          # stable asahi/installer_data.json pointer is a copy of it, written
          # only after the release is uploaded and verified.
          BASE_URL="${PUBLIC_BASE}/releases/${RELEASE_VERSION}" \
            sudo -E ./scripts/make-payload.sh "$PAYLOAD_IMAGE" "$PAYLOAD_NAME" "$PAYLOAD_SIZE_GB"
          # Which verified bootstrap this payload packages, and from which
          # revision of this repo, so a published payload can be traced back
          # and rolled back to an exact input (#122).
          jq -n --arg image "$PAYLOAD_IMAGE" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg version "$RELEASE_VERSION" \
            '{version: $version, bootstrapImage: $image, sourceSha: $sha, runId: $run}' \
            | sudo tee "out/$PAYLOAD_NAME.provenance.json"

      - name: "Test: payload structure, boot chain, rootfs, installer_data"
        env:
          REQUIRE_BOOTSTRAP: "1"
          PAYLOAD_NAME: ${{ inputs.name }}
        run: sudo -E ./scripts/test-payload.sh "out/$PAYLOAD_NAME.zip" out/installer_data.json

      - name: Install qemu + U-Boot firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils u-boot-qemu ipxe-qemu parted dosfstools

      - name: "Test: boot the reconstructed install (U-Boot EFI chain)"
        env:
          PAYLOAD_NAME: ${{ inputs.name }}
        run: sudo ./scripts/test-boot-payload.sh "out/$PAYLOAD_NAME.zip"

      - name: Upload boot serial log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: payload-boot-serial-${{ github.run_id }}
          path: serial-payload-boot.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload payload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.name }}-payload
          path: out/
          retention-days: 14

      - name: Publish release to Cloudflare R2 and move the pointer
        # Runs only after every test above passed, and only from main. Writes
        # only under asahi/ (the bucket also serves live-isos/) and deletes
        # nothing; see scripts/publish-payload-r2.sh and
        # runbooks/r2-payload-rollback.md (#99, #132).
        if: ${{ inputs.upload_r2 && github.ref == 'refs/heads/main' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PAYLOAD_NAME: ${{ inputs.name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for required in \
            RCLONE_CONFIG_R2_ACCESS_KEY_ID \
            RCLONE_CONFIG_R2_SECRET_ACCESS_KEY \
            RCLONE_CONFIG_R2_ENDPOINT \
            R2_BUCKET; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::${required} is required when upload_r2=true"
              exit 1
            fi
          done
          command -v rclone >/dev/null || { sudo apt-get update && sudo apt-get install -y rclone; }
          ./scripts/publish-payload-r2.sh out "$PAYLOAD_NAME" "$RELEASE_VERSION" \
            "R2:${R2_BUCKET}/asahi" "$PUBLIC_BASE"
          {
            echo "### Published asahi payload ${RELEASE_VERSION}"
            echo
            echo "- Pointer: ${PUBLIC_BASE}/installer_data.json"
            echo "- Payload: ${PUBLIC_BASE}/releases/${RELEASE_VERSION}/${PAYLOAD_NAME}.zip"
          } >> "$GITHUB_STEP_SUMMARY"
